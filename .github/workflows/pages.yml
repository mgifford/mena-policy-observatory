name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate record structure
        run: python framework/validate.py
      - name: Validate toolkit packets, queues and tests
        run: |
          python research-toolkit/scripts/validate_packets.py research-toolkit/examples/valid-packet.json
          python research-toolkit/incoming/tranche-02/validate.py
          python -m unittest discover -s research-toolkit/tests -p "test_*.py" -v
          python research-toolkit/scripts/report_queue.py research-toolkit/backlog/tasks.jsonl research-toolkit/backlog/cross-domain-tasks.jsonl research-toolkit/backlog/tasks-tranche-02.jsonl
      - name: Check research-toolkit manifest is current
        run: python research-toolkit/scripts/manifest.py research-toolkit --output research-toolkit/MANIFEST.json --check
      - name: Check tranche integration is current
        run: python research-toolkit/scripts/import_tranche.py --check
      - name: Check publisher registry and source checks are current
        run: python research-toolkit/scripts/registry.py --check
      - name: Check instrument identity is current
        run: python research-toolkit/scripts/instruments.py --check
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build site
        run: python framework/build.py --region mena
      - name: Check committed generated output is current
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run: python framework/build.py --region mena"
            exit 1
          fi
      - name: Lint generated HTML
        run: python framework/check_html.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v5
        with:
          name: public-site
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
